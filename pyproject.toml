[project]
name = "pepita-wa"
version = "0.23.1"
description = "Transcricao e OCR locais para a extensao pepita-wa, que exporta conversas do WhatsApp Web em Markdown"
requires-python = ">=3.13"
dependencies = [
    "winrt-runtime>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
    "winrt-Windows.Globalization>=3.2",
    "winrt-Windows.Graphics.Imaging>=3.2",
    "winrt-Windows.Media.Ocr>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
]

[project.optional-dependencies]
# VAD dentro do `wa servir` (vad = "local"), so em computador sem a distro. As
# mesmas versoes do servico-whisper/requirements.txt.
vad-local = ["numpy==2.5.3", "onnxruntime==1.30.0", "av==18.1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
wa = "wacervo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wacervo"]
